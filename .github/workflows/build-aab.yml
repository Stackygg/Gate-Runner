name: Générer le bundle Google Play (AAB signé)

# Lancement :
#   - en poussant un tag de version, depuis n'importe quelle branche : git tag v1.0.0 && git push origin v1.0.0
#   - ou manuellement depuis l'onglet Actions (une fois ce fichier présent sur la branche principale)
# Secrets requis (Settings > Secrets and variables > Actions) :
#   ANDROID_KEYSTORE_BASE64  : contenu de upload-keystore.base64.txt
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD : valeurs de keystore.properties
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version affichée sur le Play Store (ex : 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-aab:
    name: Compilation du bundle release signé
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 🏷️ Numéro de version
        id: version
        run: |
          NAME="${{ inputs.version_name }}"
          if [ -z "$NAME" ]; then NAME="${GITHUB_REF_NAME#v}"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: ⚙️ Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Configuration de Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: 📱 Configuration du SDK Android & Licences
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: 📦 Installation des dépendances NPM
        run: npm ci

      - name: 🏗️ Compilation du jeu Web (Vite)
        run: npm run build

      - name: 🔄 Synchronisation Capacitor vers Android
        run: npx cap sync android

      - name: 🔑 Restauration de la clé d'envoi
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/upload-keystore.p12"

      - name: 🔨 Compilation du bundle (:app:bundleRelease)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Le Play Store refuse deux envois avec le même versionCode : il suit le numéro d'exécution
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: ✅ Vérification de la signature
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          ls -lh "$AAB"
          jarsigner -verify "$AAB" | tail -1

      - name: 📤 Publication du bundle en Artifact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: SpaceGateRunner-${{ steps.version.outputs.name }}-build${{ github.run_number }}-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: 🧹 Suppression de la clé du runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.p12"

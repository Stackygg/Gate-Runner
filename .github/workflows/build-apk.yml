name: Générer APK Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilation APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Configuration de Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: 📱 Configuration du SDK Android & Licences
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: 📦 Installation des dépendances NPM
        run: npm install

      - name: 🏗️ Compilation du jeu Web (Vite)
        run: npm run build

      - name: 🔄 Synchronisation Capacitor vers Android
        run: npx cap sync android

      - name: 🔑 Droits d'exécution sur Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 🔨 Compilation de l'APK (assembleDebug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 Préparation du fichier APK final
        run: |
          echo "=== Recherche du fichier APK généré ==="
          find android -name "*.apk"
          APK_PATH=$(find android -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ ERREUR: Aucun fichier APK trouvé !"
            exit 1
          fi
          echo "✅ Fichier APK trouvé : $APK_PATH"
          cp "$APK_PATH" StackyFleet.apk
          ls -lh StackyFleet.apk

      - name: 📤 Publication en tant qu'Artifact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: StackyFleet-Android-APK
          path: StackyFleet.apk
          retention-days: 30

      - name: 🚀 Publication de la Release GitHub publique
        run: |
          gh release create "v1.0.${{ github.run_number }}" StackyFleet.apk \
            --title "Stacky Fleet v1.0.${{ github.run_number }}" \
            --notes "🎮 Téléchargez **StackyFleet.apk** ci-dessous directement sur votre smartphone Android pour installer le jeu !" \
            --latest \
            --clobber || gh release upload "v1.0.${{ github.run_number }}" StackyFleet.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

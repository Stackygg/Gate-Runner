name: Générer APK Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilation APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Configuration de Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: 📱 Configuration du SDK Android & Licences
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: 📦 Installation des dépendances NPM
        run: npm install

      - name: 🏗️ Compilation du jeu Web (Vite)
        run: npm run build

      - name: 🔄 Synchronisation Capacitor vers Android
        run: npx cap sync android

      - name: 🔑 Droits d'exécution sur Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 🔨 Compilation de l'APK (:app:assembleDebug)
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ Gradle a échoué avec le code ${PIPESTATUS[0]}"
            exit ${PIPESTATUS[0]}
          fi

      - name: 📦 Préparation du fichier APK final
        run: |
          # Commit gradle log and directory tree to build-logs branch for complete diagnosis
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          cp gradle.log full_gradle.log || true
          echo -e "\n=== ARBORESCENCE BUILD ===" >> full_gradle.log
          find android -maxdepth 5 >> full_gradle.log || true
          git add full_gradle.log
          git commit -m "ci: gradle build log and file list" || true
          git push origin build-logs --force || true
          
          echo "=== Recherche de tous les fichiers .apk ==="
          find . -name "*.apk"
          APK_PATH=$(find . -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ ERREUR: Aucun fichier APK trouvé !"
            exit 1
          fi
          echo "✅ Fichier APK trouvé : $APK_PATH"
          cp "$APK_PATH" StackyFleet.apk
          ls -lh StackyFleet.apk

      - name: 📤 Publication en tant qu'Artifact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: StackyFleet-Android-APK
          path: StackyFleet.apk
          retention-days: 30

      - name: 🚀 Publication de la Release GitHub publique
        run: |
          gh release create "v1.0.${{ github.run_number }}" StackyFleet.apk \
            --title "Stacky Fleet v1.0.${{ github.run_number }}" \
            --notes "🎮 Téléchargez **StackyFleet.apk** ci-dessous directement sur votre smartphone Android pour installer le jeu !" \
            --latest \
            --clobber || gh release upload "v1.0.${{ github.run_number }}" StackyFleet.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

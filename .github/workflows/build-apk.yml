name: Générer APK Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilation APK Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: ⚙️ Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Configuration de Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: 📱 Configuration du SDK Android & Licences
        uses: android-actions/setup-android@v3

      - name: 📦 Installation des dépendances NPM
        run: npm install

      - name: 🏗️ Compilation du jeu Web (Vite)
        run: npm run build

      - name: 🔄 Synchronisation Capacitor vers Android
        run: npx cap sync android

      - name: 🔑 Droits d'exécution sur Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 🔨 Compilation de l'APK (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 Préparation du fichier APK final
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk StackyFleet.apk

      - name: 📤 Publication en tant qu'Artifact GitHub
        uses: actions/upload-artifact@v4
        with:
          name: StackyFleet-Android-APK
          path: StackyFleet.apk
          retention-days: 30

      - name: 🚀 Création / Mise à jour de la Release GitHub publique
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: latest
          name: "Stacky Fleet - Dernière version APK"
          body: |
            🎮 **Stacky Fleet : Gate Runner**
            
            Téléchargez le fichier `StackyFleet.apk` ci-dessous directement sur votre smartphone Android pour installer le jeu !
            
            *(Si Android affiche un avertissement de sécurité lors de l'installation, autorisez simplement l'installation depuis cette source).*
          draft: false
          prerelease: false
          files: StackyFleet.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
